name: Check BAZARSPORT
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm run install:ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Validate independent Cloudflare staging output; this does NOT deploy.
      - run: npm run build:staging
      - run: npm run deploy:staging -- --dry-run
